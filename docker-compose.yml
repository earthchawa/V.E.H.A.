# Run on an academy server:  docker compose up -d --build
# First admin account:        docker compose exec app npx tsx prisma/seed.ts
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: classroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: classroom
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classroom"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://classroom:${POSTGRES_PASSWORD}@db:5432/classroom?schema=public
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "3000:3000"

volumes:
  db-data:
  uploads:
